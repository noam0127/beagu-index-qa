name: Stage40 Lv3 15-case real Auth proof — retired (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage40-lv3-e2e-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-lv3-check:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Signed Lv3 test endpoint retired
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 20 -o /tmp/lv3.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' 'https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage40-lv3-oidc-once')
          test "$status" = 410
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/lv3.json').read_text())
          assert payload['status']=='DISABLED'
          assert payload['reason']=='STAGE40_LV3_QA_COMPLETED'
          print('PASS: run 45054501623 completed real JWT Lv3 cross-account 15/15 cases; staged fixture retired')
          PY
          rm -f /tmp/lv3.json
