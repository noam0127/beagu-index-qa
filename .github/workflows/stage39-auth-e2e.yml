name: Stage39 real two-user staging Auth + TOTP Chromium (ONE SHOT, ISOLATED)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage39-auth-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: stage39-auth-one-shot
  cancel-in-progress: false

jobs:
  staging-actual-two-user:
    if: github.repository == 'noam0127/beagu-index-qa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGE39_AUTH_FIXTURE_FILE: ${{ runner.temp }}/stage39-auth-fixture.json
    steps:
      - name: Checkout isolated QA test repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: qa

      - name: Checkout pinned, reviewed RC packaging tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: noam0127/beagu-index
          ref: 640f66c844a10bd894d4f6d31d0f4601c38d5b33
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Set up Node 22 for actual browser and policy tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Build exact RC package isolated to staging (never deploy production)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 640f66c844a10bd894d4f6d31d0f4601c38d5b33
          git fetch --no-tags origin \
            +refs/heads/release/v1.1.0-rc.1:refs/remotes/origin/release/v1.1.0-rc.1
          test "$(git rev-parse refs/remotes/origin/release/v1.1.0-rc.1)" = 5c95aadad971901a8222f83c52e93bf901a3aeb7
          python3 scripts/release-manager/build-offline-rc-bundle.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=Path('_preview_standalone_site')
          m=json.loads((r/'stage38-release-manifest.json').read_text())
          assert m['source_sha']=='5c95aadad971901a8222f83c52e93bf901a3aeb7'
          assert m['supabase_project_ref']=='ycwuugggqbunlbwuzvbx'
          assert not (r/'CNAME').exists()
          for path in r.rglob('*'):
            if path.is_file() and path.suffix in ('.html','.js','.css','.json'):
              text=path.read_text(encoding='utf8')
              assert 'snvzwrexuqavnfvzgxqj' not in text,path
              assert 'sb_publishable_WbByHRhd0RmNiRrYHaINXQ_u5dfegL2' not in text,path
          print('PASS exact RC, local-only and isolated staging backend')
          PY

      - name: Verify Lv3, account ownership, MFA/role and existing UI contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node tests/v1.1.0-stage35-lv3-member.mjs
          node tests/v1.1.0-stage35-member-admin-ownership.mjs
          node tests/admin-auth-authorization-static.cjs
          node tests/admin-members-static.cjs
          node tests/levelup-provisional-v1.cjs
          node tests/challenge-lv2-account-entry.mjs
          node tests/auth-journey-states.mjs
          node tests/postit-member-auth.cjs

      - name: Install headless Chromium test runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix qa/.stage39-browser --no-save --no-package-lock playwright@1.56.1
          qa/.stage39-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Create only two ephemeral signed staging Auth fixture identities
        shell: bash
        run: |
          set -euo pipefail
          node qa/scripts/stage39-oidc-fixture.cjs create
          chmod 600 "$STAGE39_AUTH_FIXTURE_FILE"

      - name: Actual Chromium AAL1 AAL2 MFA, role separation, revoked-session check
        working-directory: source
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/qa/.stage39-browser/node_modules
        run: |
          set -euo pipefail
          node --check ../qa/tests/stage39-real-staging-auth-mfa.cjs
          node ../qa/tests/stage39-real-staging-auth-mfa.cjs

      - name: Always revoke/delete staging fixture accounts (also on test failure)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node qa/scripts/stage39-oidc-fixture.cjs cleanup
          test ! -e "$STAGE39_AUTH_FIXTURE_FILE"

      - name: Result scope (no email inbox confirmation or hosted auth)
        if: always()
        run: |
          echo 'Never promote to production. This is the actual LOCAL origin pinned RC Auth/AAL2 browser test.'
          echo 'Email confirmation is test-admin-confirmed, NOT proof of actual inbox delivery.'
          echo 'Hosted GitHub Pages / still has static-only CSP and cannot accept real credentials.'
