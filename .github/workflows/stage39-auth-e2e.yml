name: Stage39 historical AAL2 success — fixture retired (READ ONLY)

# The original signed one-shot real AAL2 run succeeded (45050044666).
# Its temporary staging Auth fixture and users were deleted. This workflow
# no longer creates users, requests GitHub OIDC, or uses Auth credentials.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage39-auth-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-staging-fixture:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert retired one-shot endpoint is immutable HTTP 410
        shell: bash
        run: |
          set -euo pipefail
          url='https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage39-auth-oidc-once'
          status=$(curl -sS --max-time 20 -o /tmp/retired-auth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"action":"create"}' "$url")
          test "$status" = 410
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/retired-auth.json').read_text())
          assert payload['status']=='DISABLED'
          assert payload['reason']=='STAGE39_SIGNED_AUTH_QA_COMPLETED'
          print('PASS: historical genuine staging AAL2 45050044666 retained; credential provisioner disabled')
          PY
          rm -f /tmp/retired-auth.json
      - name: No new account or production release
        run: echo 'Historical only: no OIDC permission, no test user creation, no production deployment.'
