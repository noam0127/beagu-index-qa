name: Stage40 signed QA remote release historical evidence — RETIRED (READ ONLY)
# Historical success: https://github.com/noam0127/beagu-index-qa/actions/runs/45059842879
# Never replay the one-shot OIDC queue after successful A→B→A cleanup.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage40-signed-remote-queue.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-retired:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Assert QA Pages is restored A and disposable staging endpoint is HTTP 410
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base="https://noam0127.github.io/beagu-index-qa/"
          with urllib.request.urlopen(base+"stage40-remote-state.json",timeout=20) as r:
              state=json.load(r)
              assert state["stage"]=="A"
              assert state["login_enabled"] is False
              assert state["api_calls_enabled"] is False
              assert state["production_release"] is False
          with urllib.request.urlopen(base+"index.html",timeout=20) as r:
              html=r.read().decode("utf8")
              assert '<meta name="qa-stage40-release" content="A">' in html
              assert "stage38-public-static-warning" in html
              assert "connect-src 'none'" in html
              assert "form-action 'none'" in html
          url="https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage40-release-queue-oidc-once"
          try:
              urllib.request.urlopen(url,timeout=20)
              raise AssertionError("One-shot queue function is still enabled")
          except urllib.error.HTTPError as e:
              assert e.code==410,f"Wrong staging API status {e.code}"
              body=json.loads(e.read())
              assert body["status"]=="DISABLED"
              assert body["reason"]=="STAGE40_SIGNED_QA_RELEASE_A_B_A_COMPLETED"
          print("PASS: independent HTTPS QA A restored and disposable signed queue permanently disabled")
          PY
