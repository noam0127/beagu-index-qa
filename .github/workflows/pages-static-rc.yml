name: QA static Pages — selectable immutable site snapshots (NO AUTH)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-static-rc.yml'
      - 'scripts/build-qa-snapshot.py'
      - 'qa-snapshot.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: qa-pages-static
  cancel-in-progress: false
jobs:
  package-and-deploy-static-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: qa
      - name: Checkout production baseline read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: noam0127/beagu-index
          ref: 36c68c8394a77a94541a2ad04a83db7242639c0c
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Package approved public site assets
        run: python3 qa/scripts/build-qa-snapshot.py source qa/qa-snapshot.json site
      - name: Configure independent QA Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$count" = 1 ]; then sleep 4; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Deploy only to QA repository
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check HTTPS pinned source and safe configuration
        env:
          QA_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json,time,os,urllib.request,pathlib
          base=os.environ['QA_URL'].rstrip('/')+'/'
          assert base=='https://noam0127.github.io/beagu-index-qa/',base
          expected=json.loads(pathlib.Path('qa/qa-snapshot.json').read_text())
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path+'?qa='+expected['source_sha'][:12],headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                  assert r.url.startswith(base) and r.status==200
                  return r.read().decode()
          for i in range(12):
              try:
                  m=json.loads(get('qa-release.json'))
                  assert m['source_sha']==expected['source_sha'] and m['version']==expected['version']
                  assert m['production_access'] is False and m['real_credentials_allowed'] is False
                  for p in ('index.html','search.html','admin.html','challenge.html','teacher-volleyball.html'):
                      html=get(p)
                      assert "connect-src 'self'" in html and "form-action 'none'" in html and 'qa-snapshot-safety' in html,p
                  print('PASS: exact source version and isolated QA HTTPS',m['source_sha'],m['version'])
                  break
              except Exception:
                  if i==11:raise
                  time.sleep(5)
          PY
