name: Stage42 real owner button → QA signed B/A evidence — retired (READ ONLY)
# Real successful one-shot historical run:
# https://github.com/noam0127/beagu-index-qa/actions/runs/45063059246
# No OIDC tokens, GitHub Pages write permission, Auth registration or queue actions.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage42-owner-button-queue-real.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-retired:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Independently check public QA A restore and retired stage42 API
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          root="https://noam0127.github.io/beagu-index-qa/"
          with urllib.request.urlopen(root+"qa-stage40-remote-state.json",timeout=25) as res:
              state=json.load(res)
              assert state["stage"]=="A"
              assert state["login_enabled"] is False
              assert state["api_calls_enabled"] is False
              assert state["production_release"] is False
          with urllib.request.urlopen(root+"index.html",timeout=25) as res:
              html=res.read().decode("utf8")
              assert '<meta name="qa-stage40-release" content="A">' in html
              assert "stage38-public-static-warning" in html
              assert "connect-src 'none'" in html
              assert "form-action 'none'" in html
          api="https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage42-owner-button-release-once"
          for method in ["GET","POST"]:
              req=urllib.request.Request(api,method=method,
                headers={"Content-Type":"application/json"},
                data=b"{}" if method=="POST" else None)
              try:
                  urllib.request.urlopen(req,timeout=25)
                  raise AssertionError("One-shot privileged QA staging function still active")
              except urllib.error.HTTPError as error:
                  assert error.code==410,f"Wrong retired status: {error.code}"
                  result=json.load(error)
                  assert result["status"]=="DISABLED"
                  assert result["reason"]=="STAGE42_REAL_ADMIN_BUTTON_SIGNED_QA_B_TO_A_COMPLETED"
          print("PASS: real admin-button QA staged B/A was completed; A restored; one-shot privileged API disabled")
          PY
