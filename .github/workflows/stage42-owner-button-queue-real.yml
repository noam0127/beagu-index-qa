name: Stage42 REAL admin AAL2 update button → QA staging queue → OIDC Pages B→A
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage42-owner-button-queue-real.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: qa-pages-static
  cancel-in-progress: false
jobs:
  real-owner-stage-button:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: github-pages
      url: https://noam0127.github.io/beagu-index-qa/
    steps:
      - name: Checkout independent QA repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: qa
          persist-credentials: false

      - name: Checkout immutable vetted packager
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: noam0127/beagu-index
          ref: 640f66c844a10bd894d4f6d31d0f4601c38d5b33
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable reviewed RC for original UI validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: noam0127/beagu-index
          ref: 5c95aadad971901a8222f83c52e93bf901a3aeb7
          path: qa/rc
          fetch-depth: 0
          persist-credentials: false

      - name: Validate original RC and create isolated QA A and B static sites
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 640f66c844a10bd894d4f6d31d0f4601c38d5b33
          test "$(git -C qa/rc rev-parse HEAD)" = 5c95aadad971901a8222f83c52e93bf901a3aeb7
          python3 qa/tests/stage40-real-release-worker-packager.py
          (
            cd source
            git fetch --no-tags origin +refs/heads/release/v1.1.0-rc.1:refs/remotes/origin/release/v1.1.0-rc.1
            test "$(git rev-parse refs/remotes/origin/release/v1.1.0-rc.1)" = 5c95aadad971901a8222f83c52e93bf901a3aeb7
            python3 scripts/release-manager/build-offline-rc-bundle.py
            python3 scripts/release-manager/build-stage38-static-mirror.py
            python3 ../qa/scripts/patch_participation_qa.py _preview_standalone_site
          )
          cp -a source/_preview_standalone_site site-a
          cp -a source/_preview_standalone_site site-b
          python3 qa/scripts/stage40_pages_aba.py prepare site-a A
          python3 qa/scripts/stage40_pages_aba.py prepare site-b B
          test ! -e site-a/CNAME && test ! -e site-b/CNAME
          python3 qa/scripts/stage40_pages_aba.py verify https://noam0127.github.io/beagu-index-qa/ A

      - name: Install pinned Chromium to click original admin release center
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix qa/.stage42-deps --no-save --no-package-lock playwright@1.56.1
          qa/.stage42-deps/node_modules/.bin/playwright install --with-deps chromium

      - name: Generate ephemeral local account test credentials (never upload)
        shell: bash
        run: python3 qa/scripts/stage42_workflow_client.py prepare

      - name: Signed QA-only owner account setup
        id: owner_setup
        shell: bash
        run: python3 qa/scripts/stage42_workflow_client.py setup

      - name: REAL original RC browser MFA login and click Stage Apply button
        id: real_button
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/qa/.stage42-deps/node_modules
          STAGE42_STATIC_DIR: source/_preview_standalone_site
          STAGE42_FIXTURE_FILE: qa/.stage42-qa-fixture.json
        run: |
          set -euo pipefail
          node --check qa/tests/stage42-real-admin-button-queue.cjs
          node qa/tests/stage42-real-admin-button-queue.cjs

      - name: Signed GitHub OIDC worker claims real admin-created staging job
        id: claim
        shell: bash
        run: python3 qa/scripts/stage42_workflow_client.py worker_claim

      - name: Configure independent QA GitHub Pages only
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload B artifact without production domain or credentials
        uses: actions/upload-pages-artifact@v3
        with:
          name: stage42-real-admin-qa-b
          path: site-b

      - name: Allow Github Pages B artifact indexing
        run: sleep 8

      - name: Actually deploy B to independent QA Pages
        id: deploy_b
        uses: actions/deploy-pages@v4
        with:
          artifact_name: stage42-real-admin-qa-b

      - name: Verify actual B on remote HTTPS
        id: verify_b
        shell: bash
        run: python3 qa/scripts/stage40_pages_aba.py verify https://noam0127.github.io/beagu-index-qa/ B

      - name: Signed worker records real HTTPS B success in staging release history
        id: complete
        run: python3 qa/scripts/stage42_workflow_client.py worker_complete

      - name: Sign staging rollback intent (NO production target)
        id: rollback_begin
        run: python3 qa/scripts/stage42_workflow_client.py worker_rollback_begin

      - name: Signed worker claims B-to-A restore
        id: rollback_claim
        run: python3 qa/scripts/stage42_workflow_client.py worker_rollback_claim

      - name: Always upload safe baseline A for restore
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        id: restore_upload
        with:
          name: stage42-real-admin-qa-a-restore
          path: site-a

      - name: Wait for baseline restore artifact to index
        if: always() && steps.restore_upload.outcome == 'success'
        run: sleep 8

      - name: Restore A on actual independent QA GitHub Pages
        if: always() && steps.restore_upload.outcome == 'success'
        uses: actions/deploy-pages@v4
        id: restore_deploy
        with:
          artifact_name: stage42-real-admin-qa-a-restore

      - name: Verify actual remote HTTPS A restored
        if: always() && steps.restore_deploy.outcome == 'success'
        id: restore_verify
        run: python3 qa/scripts/stage40_pages_aba.py verify https://noam0127.github.io/beagu-index-qa/ A

      - name: Commit verified A restoration to signed staging audit
        if: always() && steps.restore_verify.outcome == 'success' && steps.rollback_claim.outcome == 'success'
        id: rollback_complete
        run: python3 qa/scripts/stage42_workflow_client.py worker_rollback_complete

      - name: Verify two real signed staging audit records, owner click and production SHA null
        if: always() && steps.rollback_complete.outcome == 'success'
        id: audit
        run: python3 qa/scripts/stage42_workflow_client.py worker_audit

      - name: Remove synthetic release rows and account after real A verification
        if: always() && steps.audit.outcome == 'success'
        id: cleanup
        run: python3 qa/scripts/stage42_workflow_client.py worker_cleanup

      - name: Emergency synthetic account and queue cleanup after A restore
        if: always() && steps.restore_verify.outcome == 'success' && steps.cleanup.outcome != 'success' && steps.owner_setup.outcome == 'success'
        id: recover
        run: python3 qa/scripts/stage42_workflow_client.py worker_recover

      - name: Scrub local ephemeral credentials regardless of results
        if: always()
        run: python3 qa/scripts/stage42_workflow_client.py scrub

      - name: State exact proof limits
        if: always()
        shell: bash
        run: |
          echo "QA only: real RC browser AAL2 + actual admin stage button; real staging Supabase queued job; signed GitHub worker; actual isolated Pages B→A; audit." >> "$GITHUB_STEP_SUMMARY"
          echo "Stage-only synthetic production baseline in UI; real production SHA and environment unchanged. Not production QA certification." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.cleanup.outcome }}" != success ||
                "${{ steps.verify_b.outcome }}" != success ||
                "${{ steps.restore_verify.outcome }}" != success ]]; then
            echo "NOT FULL PASS: release, audit, cleanup or HTTPS restore failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PASS: actual UI button -> owner AAL2 -> staging job -> OIDC worker -> HTTPS B -> HTTPS A -> clean DB." >> "$GITHUB_STEP_SUMMARY"
