name: v1.11.2 isolated Chromium and regression (NO DEPLOY)
on:
  push:
    branches: ['qa/v1112-together-offline-chromium']
    paths:
      - '.github/workflows/v1112-together-offline.yml'
      - 'tests/v1112-together-offline-browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: noam0127/beagu-index
          ref: 'e7a1c0edebbd2832c5760a2a804444b27dafaad3'
          path: candidate
          persist-credentials: false
      - name: Verify pinned source
        run: test "$(git -C candidate rev-parse HEAD)" = 'e7a1c0edebbd2832c5760a2a804444b27dafaad3'
      - name: Static and simulated API regressions (no live requests)
        working-directory: candidate
        run: |
          status=0
          for test in tests/challenge-auth-ui.mjs tests/challenge-certificate-privacy-v1.mjs scripts/test-challenge-referral-premium.cjs scripts/test-challenge-lv2-card.cjs tests/participation-code-unified.mjs tests/challenge-search-telemetry.mjs tests/search-compare-unity.mjs tests/statistics-lv2-price-upgrade-v1.mjs tests/site-nav-challenge-unity.mjs; do
            echo "::group::$test"
            node "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Install test-only Chromium tooling
        if: always()
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --fetch-retries=1 playwright@1.56.1 html2canvas@1.4.1
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then
            "$browser" --version
            echo "BEAGU_CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --only-shell
          fi
      - name: Chromium offline E2E (real PNG and clipboard)
        if: always()
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 --directory candidate > /tmp/v1112-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8124/challenge.html >/dev/null && break; sleep 1; done
          node tests/v1112-together-offline-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1112-fixture-browser-evidence
          path: artifacts/v1112/
          if-no-files-found: ignore
