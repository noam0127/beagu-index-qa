name: Stage40 email QA historical Signup delivery — retired (READ ONLY)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage40-email-signup-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify temporary staging email sender deleted
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 20 -o /tmp/stage40-retired.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' 'https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage40-email-qa-once')
          test "$status" = 410
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/stage40-retired.json').read_text())
          assert j['status']=='DISABLED'
          assert j['reason']=='STAGE40_EMAIL_QA_CLEANUP_COMPLETED'
          print('PASS: historical real inbox delivery retained; QA account and email tool retired')
          PY
          rm -f /tmp/stage40-retired.json
