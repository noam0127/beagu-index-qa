name: Stage40 real 2026 privacy HTTP 12-case historical evidence — read only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage40-live-privacy-http-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assert-retired:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Isolated staging live-privacy fixture is permanently disabled
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 20 -o /tmp/retired-privacy.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' 'https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage40-real-privacy-http-once')
          test "$status" = 410
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/retired-privacy.json').read_text())
          assert result['status']=='DISABLED'
          assert result['reason']=='STAGE40_REAL_PRIVACY_HTTP_PASSED_RETIRED'
          print('PASS: original staging HTTP 12/12 evidence #45057131311 retained; provisioning retired')
          PY
          rm -f /tmp/retired-privacy.json
