name: Stage40 hosted HTTPS AAL2 historical success — retired (READ ONLY)

# Historical run 45053847577 completed real HTTPS desktop AAL2, mobile
# cross-role, temporary account deletion and actual static Pages restore.
# Re-running is intentionally READ-ONLY; no Pages deployment or OIDC writes.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage40-hosted-auth-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Public QA site is static-only; temporary hosted auth path gone
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base='https://noam0127.github.io/beagu-index-qa/'
          with urllib.request.urlopen(base+'admin.html',timeout=20) as r:
            body=r.read().decode('utf8')
            assert 'stage38-cdn-static-guard' in body
            assert "connect-src 'none'" in body
          with urllib.request.urlopen(base+'stage38-static-mirror.json',timeout=20) as r:
            meta=json.loads(r.read())
            assert meta['login_enabled'] is False and meta['api_calls_enabled'] is False
          try:
            urllib.request.urlopen(base+'stage40-hosted-auth-test-manifest.json',timeout=20)
            raise RuntimeError('Temporary hosted Auth route is still published')
          except urllib.error.HTTPError as e:assert e.code==404
          print('PASS: historical hosted real MFA evidence kept, public QA site reverted')
          PY
      - name: One-shot staging API clones permanently disabled
        shell: bash
        run: |
          set -euo pipefail
          base=https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1
          for slug in beagu-stage40-hosted-auth-oidc-once beagu-stage40-admin-access beagu-stage40-admin-dashboard-v1 beagu-stage40-admin-members-v1 beagu-stage40-release-manager-v1; do
            code=$(curl --max-time 20 -sS -o /tmp/disabled.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' "$base/$slug")
            test "$code" = 410
          done
          rm -f /tmp/disabled.json
          echo 'PASS: all disposable stage40 staging endpoints retired; no test users created'
