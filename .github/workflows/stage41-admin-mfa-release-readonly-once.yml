name: Stage41 owner AAL2 release security historical proof — retired (READ ONLY)
# 26/26 real owner authorization checks passed in historical run #45061725613.
# That run's final cleanup failed because admin audit logs are append-only.
# Guarded SQL subsequently removed only synthetic account, factor, allowlist,
# and three QA-only audit entries. No owner login test can be rerun here.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage41-admin-mfa-release-readonly-once.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-safe-retirement:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Real remote QA endpoint is permanently retired, with no new accounts
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          endpoint="https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage41-admin-mfa-release-readonly-once"
          for method in ("GET","POST"):
              req=urllib.request.Request(endpoint,method=method,
                headers={"Content-Type":"application/json"},
                data=b"{}" if method=="POST" else None)
              try:
                  urllib.request.urlopen(req,timeout=25)
                  raise AssertionError("One-shot privileged test runner was not retired")
              except urllib.error.HTTPError as e:
                  assert e.code==410,f"Expected 410, got {e.code}"
                  j=json.loads(e.read().decode())
                  assert j["status"]=="DISABLED"
                  assert j["reason"]=="STAGE41_REAL_OWNER_AAL2_AUTHORIZATION_QA_RETIRED"
          print("PASS: real staging privilege-test endpoint retired; no Auth/db writes")
          PY
