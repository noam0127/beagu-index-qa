name: Stage41 live owner AAL1→TOTP AAL2 release authorization (QA ONLY ONE SHOT)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage41-admin-mfa-release-readonly-once.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: stage41-live-owner-aal2-once
  cancel-in-progress: false
jobs:
  real-aal2-release-gates:
    if: github.repository == 'noam0127/beagu-index-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Unsigned calls to temporary test server rejected without mutation
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage41-admin-mfa-release-readonly-once'
          for attempt in 1 2 3 4 5; do
            http=$(curl -sS --max-time 25 -o /tmp/admin-qa-unauth.json -w '%{http_code}' -X POST "$endpoint")
            echo "Anonymous endpoint status: $http"
            if [[ "$http" == 401 || "$http" == 403 ]]; then
              echo 'PASS: authorization enforced on synthetic owner test runner'
              exit 0
            fi
            if [[ "$http" != 404 ]]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Prove actual TOTP AAL2 and owner-only read-only release API using real hosted Auth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error
          url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url+=("&" if "?" in url else "?")+"audience="+urllib.parse.quote("beagu-stage41-admin-readonly-qa")
          with urllib.request.urlopen(urllib.request.Request(url,headers={
             "Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          }),timeout=25) as res:
              jwt=json.load(res)["value"]
          api="https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage41-admin-mfa-release-readonly-once"
          req=urllib.request.Request(api,method="POST",data=b"{}",headers={
              "Content-Type":"application/json","Authorization":"Bearer "+jwt})
          try:
              with urllib.request.urlopen(req,timeout=160) as res:
                  result=json.load(res);status=res.status
          except urllib.error.HTTPError as error:
              result=json.loads(error.read().decode());status=error.code
          out={k:result[k] for k in ("status","checks_passed","reason","cleanup_ok","scope","production_untouched") if k in result}
          print("Real AAL2 release security proof",status,json.dumps(out,ensure_ascii=False))
          assert status==200 and result.get("status")=="PASS"
          assert result.get("checks_passed")==26
          assert result.get("cleanup_ok") is True
          assert result.get("production_untouched") is True
          PY
